name: Build SimCity 4 Starter

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, purebasic]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile PureBasic launcher
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $compiler = 'C:\Program Files (x86)\PureBasic\Compilers\pbcompiler.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\simcity4-starter.pb'
          $output = Join-Path $env:GITHUB_WORKSPACE 'simcity4-starter.exe'

          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "PureBasic compiler not found: $compiler"
          }

          & $compiler $source /EXE $output
          if ($LASTEXITCODE -ne 0) {
            throw "PureBasic compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: simcity4-starter
          path: simcity4-starter.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Windows, purebasic]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: simcity4-starter
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/simcity4-starter.exe
          generate_release_notes: true
